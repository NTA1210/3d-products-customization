services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: product3d
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction
    ports: ["6379:6379"]

volumes:
  pgdata:
