name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @product3d/api prisma:generate
      - name: Validate Python worker syntax
        run: python -m py_compile workers/export/convert.py workers/geometry/analyze.py workers/render/render.py tests/geometry_worker_smoke.py
      - name: Install geometry worker runtime
        run: python -m pip install --disable-pip-version-check -r workers/geometry/requirements.txt
      - name: Exercise Trimesh geometry worker
        run: python tests/geometry_worker_smoke.py
      - run: pnpm test
      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build > build.log 2>&1
      - name: Upload build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Fail CI when build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Install Chromium for browser E2E
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser critical-flow E2E
        run: pnpm test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
